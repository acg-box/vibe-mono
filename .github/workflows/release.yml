name: Release

permissions:
  contents: write

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_TERM_COLOR: always

  MOLD_VERSION: 2.41.0
  MOLD_X86_64_LINUX_SHA256: a3696680d99e692970590a178bc3a33d78d60d1c6dc9db7a11b557b02b751f5d

  RUST_BACKTRACE: full

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build ${{ matrix.target.name }} package
    runs-on: ${{ matrix.target.os }}
    strategy:
      matrix:
        target:
          [
            {
              name: aarch64-apple-darwin,
              os: macos-latest,
              archive: name_placeholder-aarch64-apple-darwin.zip,
            },
            {
              name: x86_64-unknown-linux-gnu,
              os: ubuntu-latest,
              archive: name_placeholder-x86_64-unknown-linux-gnu.tar.gz,
            },
            {
              name: x86_64-pc-windows-msvc,
              os: windows-latest,
              archive: name_placeholder-x86_64-pc-windows-msvc.zip,
            },
          ]
    steps:
      - name: Fetch latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true

      - name: Add target
        run: rustup target add ${{ matrix.target.name }}

      # The build script embeds Git SHA, which can change without a Rust source fingerprint change.
      - name: Remove cached package outputs
        run: cargo clean -p name_placeholder --release --target ${{ matrix.target.name }}

      - name: Install pinned mold (Linux)
        if: matrix.target.name == 'x86_64-unknown-linux-gnu'
        id: mold
        uses: ./.github/actions/install-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_X86_64_LINUX_SHA256 }}

      - name: Build with mold (Linux)
        if: matrix.target.name == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          test -x "${{ steps.mold.outputs.mold_libexec }}/ld"
          cargo rustc \
            -p name_placeholder \
            --release \
            --locked \
            --target "${{ matrix.target.name }}" \
            -- \
            -C linker-features=-lld \
            -C link-self-contained=-linker \
            -C "link-arg=-B${{ steps.mold.outputs.mold_libexec }}"

      - name: Verify mold-linked binary identity (Linux)
        if: matrix.target.name == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target.name }}/release/name_placeholder"
          version="$("${binary}" --version)"
          expected_suffix="-${GITHUB_SHA}-${{ matrix.target.name }}"
          case "${version}" in
            *"${expected_suffix}") ;;
            *)
              echo "Unexpected binary identity: ${version}" >&2
              exit 1
              ;;
          esac
          readelf --string-dump=.comment \
            "${binary}" \
            | grep -F "mold ${MOLD_VERSION}"

      - name: Build with platform linker
        if: matrix.target.name != 'x86_64-unknown-linux-gnu'
        run: cargo build -p name_placeholder --release --locked --target ${{ matrix.target.name }}

      - name: Verify binary identity (macOS)
        if: matrix.target.name == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          version="$(target/${{ matrix.target.name }}/release/name_placeholder --version)"
          expected_suffix="-${GITHUB_SHA}-${{ matrix.target.name }}"
          case "${version}" in
            *"${expected_suffix}") ;;
            *)
              echo "Unexpected binary identity: ${version}" >&2
              exit 1
              ;;
          esac

      - name: Verify binary identity (Windows)
        if: matrix.target.name == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $version = & "target/${{ matrix.target.name }}/release/name_placeholder.exe" --version
          $expectedSuffix = "-$env:GITHUB_SHA-${{ matrix.target.name }}"
          if (-not $version.EndsWith($expectedSuffix)) {
            throw "Unexpected binary identity: $version"
          }

      - name: Pack (macOS)
        if: matrix.target.os == 'macos-latest'
        run: |
          mv target/${{ matrix.target.name }}/release/name_placeholder .
          zip "${{ matrix.target.archive }}" name_placeholder

      - name: Pack (Windows)
        if: matrix.target.os == 'windows-latest'
        run: |
          mv target/${{ matrix.target.name }}/release/name_placeholder.exe .
          Compress-Archive -Path name_placeholder.exe -DestinationPath "${{ matrix.target.archive }}"

      - name: Pack (Linux)
        if: matrix.target.os == 'ubuntu-latest'
        run: |
          mv target/${{ matrix.target.name }}/release/name_placeholder .
          tar -czf "${{ matrix.target.archive }}" name_placeholder

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          if-no-files-found: error
          path: ${{ matrix.target.archive }}
          retention-days: 1

  # release:
  #   name: Release
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Publish
  #       uses: softprops/action-gh-release@v3
  #       with:
  #         discussion_category_name: Announcements
  #         generate_release_notes: true

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          merge-multiple: true
          path: artifacts
          pattern: name_placeholder-*
          skip-decompress: true

      - name: Verify release artifacts
        run: |
          test "$(find artifacts -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 3
          test -f artifacts/name_placeholder-aarch64-apple-darwin.zip
          test -f artifacts/name_placeholder-x86_64-unknown-linux-gnu.tar.gz
          test -f artifacts/name_placeholder-x86_64-pc-windows-msvc.zip
          unzip -t artifacts/name_placeholder-aarch64-apple-darwin.zip
          tar -tzf artifacts/name_placeholder-x86_64-unknown-linux-gnu.tar.gz
          unzip -t artifacts/name_placeholder-x86_64-pc-windows-msvc.zip

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          discussion_category_name: Announcements
          generate_release_notes: true
          files: artifacts/*

  publish-on-crates-io:
    name: Publish on crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true

      - name: Login
        run: cargo login ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish
        run: cargo publish -p name_placeholder --locked
