name: Language Checks

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust-check:
    name: Language check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          rustflags: ''

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install CI tools
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-make,nextest,taplo

      - name: Install locked TypeScript tooling
        run: npm ci --ignore-scripts

      - name: Run Rust format check
        run: cargo make fmt-rust-check

      - name: Run TOML format check
        run: cargo make fmt-toml-check

      - name: Run TypeScript format check
        run: cargo make fmt-typescript-check

      - name: Run Rust check
        run: cargo make check-rust

      - name: Run TypeScript check
        run: cargo make check-typescript

      - name: Run Rust style check
        uses: acg-box/vibe-style@3a0959eac5363c4c427382bae1d80d87ecadb702 # v0.2.3
        with:
          language: rust
          workspace: true
          args: --all-features
          version: v0.2.3

      - name: Run Rust clippy
        run: cargo make lint-rust

      - name: Run TypeScript lint
        run: cargo make lint-typescript

      - name: Run Rust tests
        run: cargo make test-rust

      - name: Run TypeScript tests
        run: cargo make test-typescript
